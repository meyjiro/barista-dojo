<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1f5c48">
<meta name="robots" content="noindex, nofollow">
<title>バリスタ道場</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E☕%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#f6f1ea; --paper:#fffdf9; --ink:#241a14; --ink2:#5d4e44; --line:#e4d9cc;
  --accent:#1f5c48; --accent-ink:#ffffff; --gold:#d8a63a; --gold-ink:#3d2b06;
  --ok:#2e7d4f; --ok-bg:#dff3e6; --ng:#b3362e; --ng-bg:#fbe1de; --crema:#e9c98a; --espresso:#3b2418;
  --shadow:0 6px 24px rgba(59,36,24,.10);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17120f; --paper:#221a15; --ink:#f3ebe2; --ink2:#c2b3a6; --line:#3a2e26;
  --accent:#4fa286; --accent-ink:#0f1f19; --gold:#e5b95a; --gold-ink:#2b1e05;
  --ok:#6fcf97; --ok-bg:#1f3a2c; --ng:#f28b82; --ng-bg:#4a2422; --crema:#b98f4f; --espresso:#e9d6c3; --shadow:0 6px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{ --bg:#17120f; --paper:#221a15; --ink:#f3ebe2; --ink2:#c2b3a6; --line:#3a2e26; --accent:#4fa286; --accent-ink:#0f1f19; --gold:#e5b95a; --gold-ink:#2b1e05; --ok:#6fcf97; --ok-bg:#1f3a2c; --ng:#f28b82; --ng-bg:#4a2422; --crema:#b98f4f; --espresso:#e9d6c3; --shadow:0 6px 24px rgba(0,0,0,.35); }
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.75;padding:0 16px calc(84px + env(safe-area-inset-bottom));}
h1,h2,h3{font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif;text-wrap:balance;line-height:1.3;margin:0}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:var(--accent)}
.wrap{max-width:640px;margin:0 auto}
/* header */
.top{display:flex;align-items:center;gap:10px;padding:14px 0 6px;padding-top:calc(14px + env(safe-area-inset-top))}
.top h1{font-size:20px;font-weight:900;letter-spacing:.02em}
.top .sub{font-size:12px;color:var(--ink2);margin-left:auto;text-align:right;line-height:1.3}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 8px calc(8px + env(safe-area-inset-bottom));z-index:10}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink2);padding:4px 0;border-radius:10px}
.tabs button .ic{font-size:20px;line-height:1}
.tabs button.on{color:var(--accent);font-weight:700}
/* cards */
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
.chap{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:14px;background:var(--paper);border:1px solid var(--line);border-radius:16px}
.chap .em{font-size:28px;width:40px;text-align:center;flex:none}
.chap .t{font-weight:700;font-size:15px}
.chap .m{font-size:12px;color:var(--ink2)}
.chap .badge{margin-left:auto;flex:none;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--line);color:var(--ink2)}
.chap .badge.ok{background:var(--ok-bg);color:var(--ok);font-weight:700}
.chap .badge.gold{background:var(--gold);color:var(--gold-ink);font-weight:700}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:700;background:var(--accent);color:var(--accent-ink);min-height:48px;width:100%;font-size:16px}
.btn.sub{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1;width:auto}
/* lesson */
.lesson h2{font-size:24px;font-weight:900;margin:6px 0 8px}
.lesson .lead{font-size:15px;color:var(--ink2);margin:0 0 14px}
.lesson h3{font-size:17px;font-weight:700;margin:22px 0 6px;padding-left:10px;border-left:4px solid var(--gold)}
.lesson p{margin:0 0 10px}
.fig{margin:14px 0;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px;overflow:hidden}
.fig svg{display:block;width:100%;height:auto}
.fig .cap{font-size:12px;color:var(--ink2);text-align:center;margin-top:4px}
.keys{background:var(--paper);border:2px solid var(--gold);border-radius:14px;padding:14px 16px;margin:18px 0}
.keys h4{margin:0 0 8px;font-size:14px;color:var(--gold-ink);background:var(--gold);display:inline-block;padding:2px 10px;border-radius:999px}
.keys ol{margin:0;padding-left:20px} .keys li{margin:4px 0;font-weight:500}
.terms{margin:14px 0;display:grid;gap:8px}
.term{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.term b{color:var(--accent)}
.nav{display:flex;justify-content:space-between;gap:10px;margin:16px 0}
.nav button{font-size:14px;color:var(--accent);font-weight:700;padding:10px 4px}
/* quiz */
.qtop{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2);margin:8px 0}
.qtop .bar{flex:1;height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.qtop .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.q{font-size:19px;font-weight:700;line-height:1.55;margin:10px 0 16px;font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:14px 14px;background:var(--paper);border:2px solid var(--line);border-radius:14px;font-size:16px;line-height:1.45;min-height:56px;transition:transform .08s}
.choice:active{transform:scale(.985)}
.choice .k{flex:none;width:30px;height:30px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--ink2)}
.choice.ok{border-color:var(--ok);background:var(--ok-bg)} .choice.ok .k{background:var(--ok);color:#fff}
.choice.ng{border-color:var(--ng);background:var(--ng-bg)} .choice.ng .k{background:var(--ng);color:#fff}
.choice.dim{opacity:.45}
.choice.picked{outline:3px solid var(--accent)}
.fb{margin:14px 0;padding:12px 14px;border-radius:12px;font-size:15px;background:var(--paper);border:1px solid var(--line)}
.fb.ok{border-color:var(--ok)} .fb.ng{border-color:var(--ng)}
.fb b{display:block;font-size:18px;margin-bottom:4px}
.fb.ok b{color:var(--ok)} .fb.ng b{color:var(--ng)}
.stamp{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:120px;opacity:0;z-index:20}
.stamp.show{animation:pop .7s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.15)}60%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.timer{font-size:13px;color:var(--ink2)}
.timer.warn{color:var(--ng);font-weight:700}
/* result */
.score{text-align:center;padding:18px 0 6px}
.score .big{font-size:64px;font-weight:900;line-height:1;font-family:"Zen Maru Gothic",sans-serif}
.score .big small{font-size:22px;color:var(--ink2);font-weight:700}
.score .msg{font-size:18px;font-weight:700;margin-top:6px}
.score .meta{font-size:13px;color:var(--ink2);margin-top:4px}
.rlist{display:grid;gap:8px;margin:14px 0}
.r{display:flex;gap:10px;padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;font-size:14px}
.r .m{flex:none;font-weight:900;width:22px}
.r.ok .m{color:var(--ok)} .r.ng .m{color:var(--ng)}
.r .e{color:var(--ink2);font-size:13px;margin-top:2px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--line);color:var(--ink2)}
.pill.on{background:var(--accent);color:var(--accent-ink)}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.opts button{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:14px}
.opts button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
/* stats */
.mastery{display:grid;gap:6px}
.mrow{display:grid;grid-template-columns:28px 1fr 56px;align-items:center;gap:8px;font-size:14px}
.mrow .b{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.mrow .b i{display:block;height:100%;background:var(--accent)}
.hist{display:flex;align-items:flex-end;gap:6px;height:110px;padding:8px 4px 0;border-bottom:1px solid var(--line)}
.hist .c{flex:1;background:var(--accent);border-radius:6px 6px 0 0;position:relative;min-width:10px}
.hist .c.exam{background:var(--gold)}
.hist .c span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--ink2)}
.hlist{font-size:13px;color:var(--ink2);margin-top:8px}
.hlist div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}
/* gate */
.gate{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
.gate .cup{font-size:64px}
.gate input{font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);width:100%;text-align:center}
.gate .err{color:var(--ng);font-size:14px;min-height:1.5em}
.muted{color:var(--ink2);font-size:13px}
.hero{background:linear-gradient(135deg,var(--espresso),#6b3f28);color:#fff7ea;border-radius:18px;padding:18px;margin:8px 0 14px}
.hero h2{font-size:22px;font-weight:900;color:#fff7ea}
.hero p{margin:6px 0 0;font-size:14px;color:#f0dcc3}
.hero .num{font-size:28px;font-weight:600;color:var(--crema)}
@media (prefers-reduced-motion:reduce){ .stamp.show{animation:none} .choice{transition:none} }
[hidden]{display:none!important}
</style>
</head>

/* ========== 保存 ========== */
const S = { get(k, d){ try{ const v = localStorage.getItem('bd.'+k); return v==null? d : JSON.parse(v);}catch(e){ return d; } }, set(k, v){ try{ localStorage.setItem('bd.'+k, JSON.stringify(v)); }catch(e){} } };

/* ========== 暗号 ========== */
async function decrypt(pass, blob){
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:b(blob.salt), iterations:200000, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b(blob.iv) }, key, b(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ========== 音 ========== */
let AC = null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); return AC; }
function tone(freq, t0, dur, type, gain){ const ac = audio(); if(!ac) return; const o = ac.createOscillator(), g = ac.createGain(); o.type = type||'sine'; o.frequency.value = freq; g.gain.setValueAtTime(0, ac.currentTime+t0); g.gain.linearRampToValueAtTime(gain||.25, ac.currentTime+t0+.01); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime+t0+dur); o.connect(g).connect(ac.destination); o.start(ac.currentTime+t0); o.stop(ac.currentTime+t0+dur+.05); }
function pingPong(){ tone(1046.5, 0, .18); tone(1318.5, .14, .35); }
function buzz(){ tone(150, 0, .35, 'sawtooth', .18); tone(110, .05, .4, 'square', .08); }
function fanfare(){ [523,659,784,1046].forEach((f,i)=>tone(f, i*.12, .3)); tone(1318, .5, .6); }
function tick(){ tone(800, 0, .04, 'square', .05); }

/* ========== 声 ========== */
let voiceOn = S.get('voice', true);
function stopSpeak(){ try{ speechSynthesis.cancel(); }catch(e){} }
function speak(text, rate){ return new Promise(res => { if(!voiceOn || !('speechSynthesis' in window)) return res(); try{ const u = new SpeechSynthesisUtterance(text); u.lang='ja-JP'; u.rate = rate||1.05; const vs = speechSynthesis.getVoices().filter(v=>/ja/i.test(v.lang)); const v = vs.find(v=>/Kyoko|O-ren|Hattori|Otoya/i.test(v.name))||vs[0]; if(v) u.voice=v; u.onend=res; u.onerror=res; speechSynthesis.speak(u); }catch(e){ res(); } }); }
try{ speechSynthesis.getVoices(); }catch(e){}

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtT = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function allQ(){ return DATA.chapters.flatMap(c => c.quiz.map((q,i) => ({...q, ch:c.id, chTitle:c.title, key:`${c.id}-${i}`}))); }
function mastery(){ return S.get('mastery', {}); }  // key -> {ok, ng}
function chapterScore(ch){ const m = mastery(); let ok=0, n=0; DATA.chapters.find(c=>c.id===ch).quiz.forEach((q,i)=>{ const r = m[`${ch}-${i}`]; if(r){ n++; if(r.last) ok++; } }); return {ok, n}; }

  <div class="terms">${c.terms.map(t=>`<div class="term"><b>${esc(t.t)}</b> — ${esc(t.d)}</div>`).join('')}</div>
  <button class="btn" id="go">🎯 この章の問題を出す（${c.quiz.length}問）</button>
  <div class="nav">${i>0?`<button id="prev">‹ 第${DATA.chapters[i-1].id}章</button>`:'<span></span>'}${i<DATA.chapters.length-1?`<button id="next">第${DATA.chapters[i+1].id}章 ›</button>`:'<span></span>'}</div></div>`;
  app.querySelector('#back').onclick = () => { VIEW=null; render(); };
  app.querySelector('#go').onclick = () => startRun({ mode:'chapter', ch:id });
  const p = app.querySelector('#prev'), n = app.querySelector('#next');
  if(p) p.onclick = () => { VIEW={type:'lesson', ch:DATA.chapters[i-1].id}; render(); window.scrollTo(0,0); };
  if(n) n.onclick = () => { VIEW={type:'lesson', ch:DATA.chapters[i+1].id}; render(); window.scrollTo(0,0); };
}

function renderQuizMenu(){
  const m = mastery(); const wrong = allQ().filter(q => m[q.key] && !m[q.key].last).length; const unseen = allQ().filter(q => !m[q.key]).length;
  app.innerHTML = header() + `
  <div class="card"><h2 style="font-size:20px;font-weight:900">🎯 問題</h2><p class="muted" style="margin:6px 0 12px">答えを押すと ピンポーン／ブブー。声で読み上げ（${voiceOn?'ON':'OFF'}）。</p>
  <div class="opts"><button id="v-on" class="${voiceOn?'on':''}">🔊 読み上げ ON</button><button id="v-off" class="${!voiceOn?'on':''}">🔇 OFF</button></div>
  <div class="grid" style="margin-top:8px">
    <button class="btn" data-mode="random">🎲 全章からランダム10問</button>
    <button class="btn gold" data-mode="wrong" ${wrong?'':'disabled'}>🔁 間違えた問題だけ（${wrong}問）</button>
    <button class="btn sub" data-mode="unseen" ${unseen?'':'disabled'}>🆕 まだ解いていない問題（${unseen}問）から10問</button>
  </div></div>
  <h3 style="margin:18px 0 8px;font-size:15px">章を選んで10問</h3>
  <div class="grid">${DATA.chapters.map(c => { const sc = chapterScore(c.id); return `<button class="chap" data-ch="${c.id}"><span class="em">${c.emoji}</span><span class="t">第${c.id}章 ${esc(c.title)}</span><span class="badge ${sc.ok===c.quiz.length&&sc.n?'gold':sc.n?'ok':''}">${sc.n?`${sc.ok}/${c.quiz.length}`:'—'}</span></button>`; }).join('')}</div>`;
  app.querySelector('#v-on').onclick = () => { voiceOn = true; S.set('voice', true); renderQuizMenu(); };
  app.querySelector('#v-off').onclick = () => { voiceOn = false; S.set('voice', false); renderQuizMenu(); };
  app.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => startRun({ mode:b.dataset.mode }));
  app.querySelectorAll('.chap').forEach(b => b.onclick = () => startRun({ mode:'chapter', ch:+b.dataset.ch }));
}

function renderExamMenu(){
  const hist = S.get('history', []).filter(h=>h.mode==='exam'); const best = hist.reduce((a,h)=>Math.max(a,h.pct),0);
  app.innerHTML = header() + `
  <div class="hero"><h2>🏆 模擬試験</h2><p>本番と同じ ${DATA.exam.questions}問・${DATA.exam.minutes}分・${DATA.exam.pass}%で合格。途中の正解・不正解は出ない（本番と同じ）。終わったら全部の答えと解説が出る。</p>
  <p style="margin-top:8px"><span class="num">${hist.length}</span><span style="font-size:13px"> 回受験　最高 </span><span class="num">${best}</span><span style="font-size:13px">%</span></p></div>
  <button class="btn gold" id="start">試験を始める</button>
  <p class="muted" style="margin-top:12px">コツ: 1問あたり約1分。迷ったら飛ばさず、いちばん近いものを選んで進む。</p>`;
  app.querySelector('#start').onclick = () => startRun({ mode:'exam' });
}

/* ========== 出題 ========== */
let RUN = null;
function pickQuestions(opt){
  const m = mastery(); let pool = allQ();
  if(opt.keys){ const set = new Set(opt.keys); return shuffle(pool.filter(q=>set.has(q.key))); }
  if(opt.mode==='chapter') pool = pool.filter(q=>q.ch===opt.ch);
  else if(opt.mode==='wrong') pool = pool.filter(q => m[q.key] && !m[q.key].last);
  else if(opt.mode==='unseen') pool = pool.filter(q => !m[q.key]);
  pool = shuffle(pool);
  if(opt.mode==='exam'){ // 章から均等に35問
    const per = {}; pool.forEach(q => (per[q.ch] = per[q.ch]||[]).push(q));
    const out = []; const chs = Object.keys(per); let i = 0;
    while(out.length < DATA.exam.questions && chs.some(c=>per[c].length)){ const c = chs[i % chs.length]; if(per[c].length) out.push(per[c].shift()); i++; }
    return shuffle(out);
  }
  if(opt.mode==='chapter') return pool;
  return pool.slice(0, 10);
}
function startRun(opt){
  audio(); stopSpeak();
  const qs = pickQuestions(opt).map(q => { const idx = shuffle([0,1,2,3]); return { ...q, order: idx, answer: idx.indexOf(q.a) }; });
  if(!qs.length) return;
  RUN = { opt, qs, i:0, results:[], start:Date.now(), exam: opt.mode==='exam', limit: opt.mode==='exam' ? DATA.exam.minutes*60 : null, timer:null };
  VIEW = { type:'run' };
  TAB = opt.mode==='exam' ? 'exam' : 'quiz'; [...tabs.querySelectorAll('button')].forEach(b => b.classList.toggle('on', b.dataset.tab===TAB));
  renderQ(); window.scrollTo(0,0);
}
function elapsed(){ return Math.floor((Date.now()-RUN.start)/1000); }
function renderQ(){
  const q = RUN.qs[RUN.i], n = RUN.qs.length;
  const label = RUN.exam ? '模擬試験' : RUN.opt.mode==='chapter' ? `第${q.ch}章` : RUN.opt.mode==='wrong' ? '間違えた問題' : 'ランダム';
  app.innerHTML = `<div class="top"><h1>${RUN.exam?'🏆':'🎯'} ${label}</h1><button class="sub" id="quit" style="color:var(--ink2);font-size:13px">やめる ✕</button></div>
  <div class="qtop"><span class="num">${RUN.i+1} / ${n}</span><div class="bar"><i style="width:${(RUN.i/n)*100}%"></i></div><span class="timer num" id="timer">${RUN.exam ? fmtT(RUN.limit-elapsed()) : fmtT(elapsed())}</span></div>
  ${RUN.exam ? '' : `<div class="muted" style="font-size:12px">第${q.ch}章 ${esc(q.chTitle)}</div>`}
  <div class="q">Q${RUN.i+1}. ${esc(q.q)}</div>
  <div class="choices">${q.order.map((oi, k) => `<button class="choice" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${esc(q.c[oi])}</span></button>`).join('')}</div>
  <div id="fb"></div>`;
  app.querySelector('#quit').onclick = () => { if(confirm('やめる？（ここまでの記録は残らない）')){ endRun(true); } };
  app.querySelectorAll('.choice').forEach(b => b.onclick = () => answer(+b.dataset.k));
  clearInterval(RUN.timer); RUN.timer = setInterval(() => { const t = app.querySelector('#timer'); if(!t) return; if(RUN.exam){ const left = RUN.limit-elapsed(); t.textContent = fmtT(Math.max(0,left)); t.classList.toggle('warn', left < 300); if(left<=0){ clearInterval(RUN.timer); finish(); } } else t.textContent = fmtT(elapsed()); }, 500);
  if(!RUN.exam && voiceOn){ speak(`問題${RUN.i+1}。${q.q}`).then(()=> RUN && RUN.i===RUN.qs.indexOf(q) && !RUN.answered ? speak(q.order.map((oi,k)=>`${'ABCD'[k]}、${q.c[oi]}`).join('。'), 1.1) : null); }
}
function answer(k){
  if(RUN.answered) return; RUN.answered = true; stopSpeak();
  const q = RUN.qs[RUN.i], ok = k===q.answer;
  RUN.results.push({ key:q.key, ok, picked:k, q });
  const m = mastery(); const r = m[q.key] || {ok:0, ng:0}; if(ok) r.ok++; else r.ng++; r.last = ok; r.at = today(); m[q.key] = r; S.set('mastery', m);
  const btns = app.querySelectorAll('.choice');
  if(RUN.exam){ btns.forEach((b,i)=>{ b.classList.toggle('picked', i===k); b.disabled = true; }); tick(); setTimeout(next, 350); return; }
  btns.forEach((b,i) => { b.disabled = true; if(i===q.answer) b.classList.add('ok'); else if(i===k) b.classList.add('ng'); else b.classList.add('dim'); });
  const st = document.getElementById('stamp'); st.textContent = ok ? '⭕️' : '❌'; st.classList.remove('show'); void st.offsetWidth; st.classList.add('show');
  if(ok) pingPong(); else buzz();
  const fb = app.querySelector('#fb'); fb.innerHTML = `<div class="fb ${ok?'ok':'ng'}"><b>${ok?'ピンポーン！ 正解':'ブブー… 正解は '+'ABCD'[q.answer]}</b>${esc(q.e)}</div><button class="btn" id="next">${RUN.i+1<RUN.qs.length?'次の問題 ›':'結果を見る'}</button>`;
  fb.querySelector('#next').onclick = next;
  if(voiceOn){ speak(ok ? '正解。' : `残念。正解は、${q.c[q.a]}。`).then(()=> speak(q.e, 1.1)); }
  if(ok){ RUN.auto = setTimeout(() => { if(RUN && RUN.answered) next(); }, voiceOn ? 6500 : 1800); }
}
function next(){ if(!RUN) return; clearTimeout(RUN.auto); stopSpeak(); RUN.answered = false; RUN.i++; if(RUN.i >= RUN.qs.length) return finish(); renderQ(); window.scrollTo(0,0); }
function endRun(abort){ if(RUN){ clearInterval(RUN.timer); clearTimeout(RUN.auto); } stopSpeak(); RUN = null; VIEW = null; render(); }
function finish(){
  clearInterval(RUN.timer); clearTimeout(RUN.auto); stopSpeak();
  const r = RUN, n = r.qs.length, ok = r.results.filter(x=>x.ok).length, sec = elapsed(), pct = Math.round(ok/n*100);
  const answeredAll = r.results.length === n; // 時間切れの場合は未回答＝不正解
  const hist = S.get('history', []); hist.push({ at: new Date().toISOString().slice(0,16), mode: r.opt.mode, ch: r.opt.ch||null, n, ok, pct, sec }); S.set('history', hist.slice(-200));
  const pass = r.exam ? pct >= DATA.exam.pass : pct===100;
  const msg = r.exam ? (pass ? '🎉 合格ライン突破！' : `あと${Math.ceil(n*DATA.exam.pass/100)-ok}問で合格ライン`) : pct===100 ? '🎉 パーフェクト！' : pct>=80 ? 'いい感じ！' : pct>=60 ? 'もう一息' : '教科書に戻ろう';
  if(pass) fanfare(); else if(pct>=70) pingPong();
  const byCh = {}; r.results.forEach(x => { const b = byCh[x.q.ch] = byCh[x.q.ch]||{ok:0,n:0,t:x.q.chTitle}; b.n++; if(x.ok) b.ok++; });
  app.innerHTML = `<div class="top"><h1>${r.exam?'🏆 模試の結果':'🎯 結果'}</h1></div>
  <div class="card"><div class="score"><div class="big">${ok}<small> / ${n}</small></div><div class="msg">${msg}</div><div class="meta num">${pct}%　${fmtT(sec)}${r.exam?`　合格ライン ${DATA.exam.pass}%`:''}${answeredAll?'':'　（時間切れ）'}</div></div></div>
  ${r.exam ? `<h3 style="margin:16px 0 8px;font-size:15px">章ごと</h3><div class="mastery">${Object.keys(byCh).sort((a,b)=>a-b).map(c=>`<div class="mrow"><span class="num">${c}</span><div class="b"><i style="width:${byCh[c].ok/byCh[c].n*100}%"></i></div><span class="num" style="text-align:right">${byCh[c].ok}/${byCh[c].n}</span></div>`).join('')}</div>` : ''}
  <div class="row" style="margin:16px 0"><button class="btn" id="again">もう一回</button>${r.results.some(x=>!x.ok)?'<button class="btn gold" id="retry">間違えたやつだけ</button>':''}<button class="btn sub" id="home">教科書へ</button></div>
  <h3 style="margin:8px 0;font-size:15px">答え合わせ</h3>
  <div class="rlist">${r.results.map((x,i)=>`<div class="r ${x.ok?'ok':'ng'}"><span class="m">${x.ok?'○':'×'}</span><div><div>Q${i+1}. ${esc(x.q.q)}</div><div style="font-weight:700;margin-top:2px">${x.ok?'':'あなた: '+esc(x.q.c[x.q.order[x.picked]])+'　'}正解: ${esc(x.q.c[x.q.a])}</div><div class="e">${esc(x.q.e)}</div></div></div>`).join('')}</div>`;
  const keys = r.results.filter(x=>!x.ok).map(x=>x.key); const opt = r.opt; RUN = null; VIEW = null;
  app.querySelector('#again').onclick = () => startRun(opt);
  const rt = app.querySelector('#retry'); if(rt) rt.onclick = () => startRunKeys(keys);
  app.querySelector('#home').onclick = () => setTab('home');
  window.scrollTo(0,0);
}
function startRunKeys(keys){ startRun({ mode:'wrong', keys }); }

/* ========== 成績 ========== */
function renderStats(){
  const hist = S.get('history', []); const last = hist.slice(-12);
  const m = mastery();
  app.innerHTML = header() + `
  <div class="card"><h2 style="font-size:20px;font-weight:900">📈 成績</h2>
  <p class="muted" style="margin:6px 0 10px">直近${last.length}回（緑＝問題、金＝模試）</p>
  ${last.length ? `<div class="hist">${last.map(h=>`<div class="c ${h.mode==='exam'?'exam':''}" style="height:${Math.max(6,h.pct)}%"><span class="num">${h.pct}</span></div>`).join('')}</div>` : '<p class="muted">まだ記録なし。問題を解くとここに出る。</p>'}
  <div class="hlist">${hist.slice(-8).reverse().map(h=>`<div><span>${h.at.replace('T',' ')} ${h.mode==='exam'?'🏆模試':h.mode==='chapter'?'第'+h.ch+'章':h.mode==='wrong'?'🔁復習':'🎲ランダム'}</span><span class="num">${h.ok}/${h.n}　${fmtT(h.sec)}</span></div>`).join('')}</div></div>
  <h3 style="margin:18px 0 8px;font-size:15px">章ごとの定着（最後に解いたときの正解率）</h3>
  <div class="card"><div class="mastery">${DATA.chapters.map(c=>{ const s = chapterScore(c.id); const p = s.n? Math.round(s.ok/c.quiz.length*100):0; return `<div class="mrow"><span>${c.emoji}</span><div><div style="font-size:13px">第${c.id}章 ${esc(c.title)}</div><div class="b"><i style="width:${p}%"></i></div></div><span class="num" style="text-align:right">${s.n?p+'%':'—'}</span></div>`; }).join('')}</div></div>
  <div class="row" style="margin-top:16px"><button class="btn sub" id="reset">記録を消す</button><button class="btn sub" id="lock">合言葉を忘れる</button></div>`;
  app.querySelector('#reset').onclick = () => { if(confirm('成績と記録を全部消す？')){ S.set('history', []); S.set('mastery', {}); S.set('read', {}); renderStats(); } };
  app.querySelector('#lock').onclick = () => { localStorage.removeItem('bd.pass'); location.reload(); };
}

/* ========== 入口 ========== */
async function boot(){
  let blob; try{ blob = await (await fetch('data.enc?v=' + Date.now())).json(); }catch(e){ app.innerHTML = `<div class="gate"><div class="cup">☕</div><p>データが読めなかった。電波を確認してもう一度開いて。</p></div>`; return; }
  const saved = S.get('pass', null);
  if(saved){ try{ DATA = await decrypt(saved, blob); return start(); }catch(e){ localStorage.removeItem('bd.pass'); } }
  app.innerHTML = `<div class="gate"><div class="cup">☕</div><h1 style="font-size:24px;font-weight:900">バリスタ道場</h1><p class="muted">${blob.chapters}章・${blob.questions}問　${esc(blob.built||'')}</p>
  <input id="pw" type="password" placeholder="合言葉" autocomplete="off" autocapitalize="off"><div class="err" id="err"></div><button class="btn" id="enter">入る</button></div>`;
  const go = async () => { const p = app.querySelector('#pw').value.trim(); app.querySelector('#err').textContent = ''; try{ DATA = await decrypt(p, blob); S.set('pass', p); start(); }catch(e){ app.querySelector('#err').textContent = '合言葉が違う'; } };
  app.querySelector('#enter').onclick = go; app.querySelector('#pw').addEventListener('keydown', e => { if(e.key==='Enter') go(); });
  app.querySelector('#pw').focus();
}
function start(){ tabs.hidden = false; setTab('home'); }
boot();
</script>
